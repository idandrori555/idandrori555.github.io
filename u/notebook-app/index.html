<!--
  NOTEBOOK (milestone 1, mobile-first). One file, no build step.

  STORED LOCALLY (IndexedDB, this browser only): subjects, notebooks, lessons,
  compressed photos, transcripts, summaries, pending analysis jobs, settings,
  and your Gemini API key.

  SENT TO GOOGLE GEMINI API: each photo you analyze (compressed JPEG) plus the
  subject name. Nothing else leaves the browser.

  HOW TO DELETE EVERYTHING: Settings > Reset app, or clear this site's data in
  the browser. Export a backup first if you want to keep anything.

  SECURITY: the key is kept in IndexedDB and is readable by anyone with access
  to this browser profile or the page's developer tools. Restrict the key in
  Google AI Studio and do not publish this file with a key in it.
-->

<script type="module">
/* ============================================================
   1. DATA LAYER (IndexedDB via Dexie)
   ============================================================ */
const GEMINI_MODEL = 'gemini-3-flash-preview'; // Change here if Google retires the model.
const COLORS = ['#1A3C34', '#E85D3A', '#7C5CBF', '#0E7AA5', '#C08A00', '#D6456E', '#2A9D8F', '#4A5568'];

const db = new Dexie('notebook-app');
db.version(1).stores({
  subjects: 'id,order,createdAt',
  notebooks: 'id,subjectId,createdAt',
  lessons: 'id,notebookId,date,status,createdAt',
  pages: 'id,lessonId,order,createdAt',
  summaryBlocks: 'id,lessonId,sourcePageId,order',
  settings: 'key',
  pendingJobs: 'id,pageId,createdAt'
});
db.version(2).stores({
  learnSets: 'id,lessonId,createdAt'
});

const uid = () => {
  try {
    if (crypto?.randomUUID) return crypto.randomUUID();
    if (crypto?.getRandomValues) {
      const b = crypto.getRandomValues(new Uint8Array(16));
      b[6] = (b[6] & 0x0f) | 0x40; b[8] = (b[8] & 0x3f) | 0x80;
      const h = [...b].map(x => x.toString(16).padStart(2, '0')).join('');
      return `${h.slice(0, 8)}-${h.slice(8, 12)}-${h.slice(12, 16)}-${h.slice(16, 20)}-${h.slice(20)}`;
    }
  } catch {}
  return `id-${Date.now().toString(36)}-${Math.floor(Math.random() * 1e12).toString(36)}`;
};
const now = () => Date.now();
const today = () => new Date().toISOString().slice(0, 10);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = d => new Date(d + 'T12:00:00').toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
const fmtLong = d => new Date(d + 'T12:00:00').toLocaleDateString(undefined, { month: 'long', day: 'numeric', year: 'numeric' });
const greeting = () => { const h = new Date().getHours(); if (h < 12) return 'Good morning'; if (h < 18) return 'Good afternoon'; return 'Good evening'; };

const getSetting = async (k, d = null) => { const r = await db.settings.get(k); return r ? r.value : d; };
const setSetting = (k, v) => db.settings.put({ key: k, value: v });

async function removeLessons(lessonIds) {
  if (!lessonIds.length) return;
  const pageIds = await db.pages.where('lessonId').anyOf(lessonIds).primaryKeys();
  await db.transaction('rw', [db.lessons, db.pages, db.summaryBlocks, db.pendingJobs, db.learnSets], async () => {
    await db.pendingJobs.bulkDelete(pageIds);
    await db.summaryBlocks.where('lessonId').anyOf(lessonIds).delete();
    await db.pages.where('lessonId').anyOf(lessonIds).delete();
    await db.learnSets.where('lessonId').anyOf(lessonIds).delete();
    await db.lessons.bulkDelete(lessonIds);
  });
}

async function pendingLessonIds() {
  const jobs = await db.pendingJobs.toArray();
  if (!jobs.length) return new Set();
  const pages = await db.pages.bulkGet(jobs.map(j => j.pageId));
  return new Set(pages.filter(Boolean).map(p => p.lessonId));
}

/* ============================================================
   2. IMAGES
   ============================================================ */
async function compress(file, max, quality) {
  let img;
  try { img = await createImageBitmap(file); }
  catch { throw { userMessage: "This photo format isn't supported. Try a JPEG or PNG." }; }
  const s = Math.min(1, max / Math.max(img.width, img.height));
  const c = document.createElement('canvas');
  c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
  if (!c.width || !c.height) throw { userMessage: "That photo couldn't be processed. Try a different one." };
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  const blob = await new Promise(res => c.toBlob(res, 'image/jpeg', quality));
  if (!blob) throw { userMessage: "That photo couldn't be processed. Try a different one." };
  return blob;
}
const blobToDataURL = b => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(b); });
const blobToB64 = async b => (await blobToDataURL(b)).split(',')[1];

/* ============================================================
   3. AI (Gemini). The key is never logged.
   ============================================================ */
const SYSTEM = `You read photos of classroom whiteboards and handouts.
Rules:
- Use only content visible in the photo. Never add facts that are not on the board.
- If text is unreadable, put it in "uncertain" instead of guessing.
- Region coordinates are fractions of the image from 0 to 1.
- Return JSON only.`;

const BLOCK_TYPES = ['heading', 'definition', 'formula', 'point', 'example'];
const SCHEMA = {
  type: 'OBJECT',
  properties: {
    title: { type: 'STRING' },
    transcript: { type: 'STRING' },
    summary: { type: 'STRING' },
    subjectGuess: { type: 'STRING' },
    confidence: { type: 'NUMBER' },
    blocks: { type: 'ARRAY', items: { type: 'OBJECT', properties: {
      type: { type: 'STRING', enum: BLOCK_TYPES },
      text: { type: 'STRING' },
      region: { type: 'OBJECT', nullable: true, properties: { x: { type: 'NUMBER' }, y: { type: 'NUMBER' }, w: { type: 'NUMBER' }, h: { type: 'NUMBER' } } }
    }, required: ['type', 'text'] } },
    uncertain: { type: 'ARRAY', items: { type: 'OBJECT', properties: { text: { type: 'STRING' }, reason: { type: 'STRING' } }, required: ['text', 'reason'] } }
  },
  required: ['title', 'transcript', 'blocks', 'summary', 'uncertain', 'subjectGuess', 'confidence']
};

function validate(o) {
  const ok = o && typeof o.title === 'string' && typeof o.summary === 'string' && typeof o.transcript === 'string'
    && Array.isArray(o.blocks) && Array.isArray(o.uncertain)
    && o.blocks.every(b => BLOCK_TYPES.includes(b.type) && typeof b.text === 'string');
  if (!ok) throw new Error('BAD_SHAPE');
  return { title: o.title, transcript: o.transcript, summary: o.summary, blocks: o.blocks, uncertain: o.uncertain };
}

async function analyzeImage(blob, subjectName) {
  const key = (await getSetting('geminiApiKey') || '').trim();
  if (!key) throw new Error('NO_KEY');
  if (!blob) throw { userMessage: "That photo couldn't be processed. Try a different one." };
  const body = {
    systemInstruction: { parts: [{ text: SYSTEM }] },
    contents: [{ role: 'user', parts: [
      { inline_data: { mime_type: 'image/jpeg', data: await blobToB64(blob) } },
      { text: `Subject: ${subjectName || 'unknown'}. Analyze this photo.` }
    ] }],
    generationConfig: { responseMimeType: 'application/json', responseSchema: SCHEMA }
  };
  const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent?key=${encodeURIComponent(key)}`, {
    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body)
  });
  if (!res.ok) throw new Error('HTTP ' + res.status);
  const data = await res.json();
  const text = (data.candidates?.[0]?.content?.parts || []).map(p => p.text || '').join('');
  let parsed;
  try { parsed = JSON.parse(text.replace(/```json|```/g, '').trim()); }
  catch { throw new Error('BAD_JSON'); }
  return validate(parsed);
}

const RETRYABLE = m => m === 'BAD_SHAPE' || m === 'BAD_JSON' || m === 'HTTP 429' || /^HTTP 5/.test(m);

function friendlyError(m) {
  if (m === 'NO_KEY') return 'Add your Gemini key in Settings to read this photo. Your lesson is saved.';
  if (m === 'HTTP 400' || m === 'HTTP 403') return 'Gemini rejected the key or request. Check your key in Settings.';
  if (m === 'HTTP 429' || /^HTTP 5/.test(m)) return 'Gemini is busy right now. We will retry automatically.';
  return "Couldn't read this photo. Try again closer to the board, with better light?";
}

async function analyzePage(pageId) {
  const page = await db.pages.get(pageId);
  const job = await db.pendingJobs.get(pageId);
  if (!page) { await db.pendingJobs.delete(pageId); return; }
  const lesson = await db.lessons.get(page.lessonId);
  if (!lesson) { await db.pendingJobs.delete(pageId); return; }
  const nb = await db.notebooks.get(lesson.notebookId);
  const subj = nb && await db.subjects.get(nb.subjectId);

  let result = null, err = null;
  for (let i = 0; i < 2 && !result; i++) {
    try { result = await analyzeImage(page.imageBlob, subj?.name); }
    catch (e) { err = e; if (!(RETRYABLE(e.message) || e instanceof TypeError)) break; }
  }
  if (result) {
    await saveResult(page, lesson, result);
    await db.pendingJobs.delete(pageId);
    return;
  }
  const m = err?.message || '';
  if (m === 'NO_KEY' || err instanceof TypeError || RETRYABLE(m)) {
    await db.pendingJobs.put({ id: pageId, pageId, attempts: (job?.attempts || 0) + 1, lastError: m || 'NETWORK', createdAt: job?.createdAt || now() });
    // Don't leave the lesson saying "Reading…" with no explanation.
    const reason = m === 'NO_KEY' ? friendlyError(m)
      : (err instanceof TypeError && !lesson.reason ? 'Waiting for a connection. Reading resumes automatically.' : undefined);
    if (reason) await db.lessons.update(lesson.id, { reason, updatedAt: now() });
    return;
  }
  await db.pendingJobs.delete(pageId);
  await db.lessons.update(lesson.id, { status: 'needs_review', reason: friendlyError(m), updatedAt: now() });
}

async function saveResult(page, lesson, r) {
  await db.transaction('rw', [db.pages, db.summaryBlocks, db.lessons], async () => {
    await db.summaryBlocks.where('sourcePageId').equals(page.id).delete();
    await db.summaryBlocks.bulkAdd(r.blocks.map((b, i) => ({
      id: uid(), lessonId: lesson.id, sourcePageId: page.id, type: b.type, text: b.text,
      sourceRegion: b.region || null, order: i
    })));
    await db.pages.update(page.id, { transcript: r.transcript, summary: r.summary, uncertain: r.uncertain });
    const patch = { status: 'ready', reason: null, updatedAt: now() };
    if (!lesson.title || lesson.title === 'Untitled lesson') patch.title = r.title || lesson.title;
    await db.lessons.update(lesson.id, patch);
  });
}

/* ============================================================
   3b. LEARN (NotebookLM-style study guide, generated per lesson)
   ============================================================ */
const LEARN_SYSTEM = `You are a warm, patient tutor teaching a student from their class notes.
Rules:
- Use only the lesson content given. Never add facts that are not in it.
- Explain simply, in short sections, as if speaking to the student.
- Flashcards: term or question on front, one short explanation on back.
- Quiz: each question has exactly 4 options with exactly one correct answer.
- Return JSON only.`;

const LEARN_SCHEMA = {
  type: 'OBJECT',
  properties: {
    teach: { type: 'STRING' },
    cards: { type: 'ARRAY', items: { type: 'OBJECT', properties: {
      front: { type: 'STRING' }, back: { type: 'STRING' }
    }, required: ['front', 'back'] } },
    quiz: { type: 'ARRAY', items: { type: 'OBJECT', properties: {
      question: { type: 'STRING' },
      options: { type: 'ARRAY', items: { type: 'STRING' } },
      answer: { type: 'NUMBER' }
    }, required: ['question', 'options', 'answer'] } }
  },
  required: ['teach', 'cards', 'quiz']
};

function validateLearn(o) {
  const okCard = c => c && typeof c.front === 'string' && typeof c.back === 'string' && (c.front + c.back).trim();
  const okQ = q => q && typeof q.question === 'string' && Array.isArray(q.options)
    && q.options.length === 4 && q.options.every(t => typeof t === 'string')
    && Number.isInteger(q.answer) && q.answer >= 0 && q.answer < 4;
  if (!o || typeof o.teach !== 'string' || !o.teach.trim() || !Array.isArray(o.cards) || !Array.isArray(o.quiz)) throw new Error('BAD_SHAPE');
  const cards = o.cards.filter(okCard).slice(0, 12).map(c => ({ front: c.front.trim(), back: c.back.trim() }));
  const quiz = o.quiz.filter(okQ).slice(0, 6).map(q => ({ question: q.question.trim(), options: q.options.map(t => t.trim()), answer: q.answer }));
  if (!cards.length && !quiz.length) throw new Error('BAD_SHAPE');
  return { teach: o.teach.trim(), cards, quiz };
}

function buildLearnContent(pages, blocks) {
  const parts = pages.map((p, i) => {
    const bs = blocks.filter(b => b.sourcePageId === p.id).map(b => `- ${b.text}`).join('\n');
    return [`Photo ${i + 1} transcript:`, p.transcript || '(none)',
      `Photo ${i + 1} summary:`, p.summary || '(none)',
      bs ? `Photo ${i + 1} notes:\n${bs}` : ''].filter(Boolean).join('\n');
  });
  return parts.join('\n\n').slice(0, 12000);
}

async function generateLearn(lesson, content) {
  const key = (await getSetting('geminiApiKey') || '').trim();
  if (!key) throw new Error('NO_KEY');
  const nb = await db.notebooks.get(lesson.notebookId);
  const subj = nb && await db.subjects.get(nb.subjectId);
  const body = {
    systemInstruction: { parts: [{ text: LEARN_SYSTEM }] },
    contents: [{ role: 'user', parts: [{ text:
      `Subject: ${subj?.name || 'unknown'}\nLesson: ${lesson.title}\n\nLesson content:\n${content}\n\nTeach this lesson, then make up to 12 flashcards and up to 6 quiz questions.` }] }],
    generationConfig: { responseMimeType: 'application/json', responseSchema: LEARN_SCHEMA }
  };
  const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent?key=${encodeURIComponent(key)}`, {
    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body)
  });
  if (!res.ok) throw new Error('HTTP ' + res.status);
  const data = await res.json();
  const text = (data.candidates?.[0]?.content?.parts || []).map(p => p.text || '').join('');
  let parsed;
  try { parsed = JSON.parse(text.replace(/```json|```/g, '').trim()); }
  catch { throw new Error('BAD_JSON'); }
  return validateLearn(parsed);
}

let busy = false;
async function processPending() {
  if (busy) return console.debug('[notebook] queue: already running');
  if (!navigator.onLine) return console.debug('[notebook] queue: offline, waiting for connection');
  if (!((await getSetting('geminiApiKey') || '').trim())) return console.debug('[notebook] queue: no API key saved');
  busy = true;
  let did = false;
  try {
    const jobs = await db.pendingJobs.orderBy('createdAt').toArray();
    console.debug('[notebook] queue: processing', jobs.length, 'job(s)');
    for (const j of jobs) {
      if (!navigator.onLine) break;
      try { await analyzePage(j.pageId); }
      catch (e) { console.debug('[notebook] queue: job failed', j.pageId, e?.message || e); }
      did = true;
    }
  } finally { busy = false; }
  if (did) route();
}

    p.style.cssText = `position:absolute;left:${cx}px;top:30%;width:${s}px;height:${s * (Math.random() > .5 ? 1 : .45)}px;border-radius:${Math.random() > .5 ? '50%' : '2px'};background:${colors[i % colors.length]}`;
    layer.append(p);
    const ang = Math.random() * Math.PI * 2, v = 120 + Math.random() * 230;
    p.animate([

    ], { duration: 900 + Math.random() * 700, easing: 'cubic-bezier(.2,.7,.3,1)' }).onfinish = () => p.remove();

/* swipe gestures (touch only) + photo position dots. Bound fresh after every render. */
let suppressClickUntil = 0;
const suppressNextClick = () => { suppressClickUntil = Date.now() + 400; };
const TAB_ORDER = ['summary', 'pages', 'transcript', 'learn'];
function handleSwipe(kind, dir) {
  if (kind === 'tabs') {
    const i = TAB_ORDER.indexOf(lessonTab);
    const n = i + (dir === 'left' ? 1 : -1);
    if (n < 0 || n >= TAB_ORDER.length || n === i) return;
    lessonTab = TAB_ORDER[n]; buzz(8); keepScroll(); route();
  } else if (kind === 'cards') {
    A.learnCardNav({ d: dir === 'left' ? 1 : -1 });
  }
}
function bindGestures() {
  document.querySelectorAll('[data-swipe]').forEach(el => {
    let x0 = 0, y0 = 0;
    el.addEventListener('touchstart', e => {
      const t = e.touches[0]; x0 = t.clientX; y0 = t.clientY;
    }, { passive: true });
    el.addEventListener('touchend', e => {
      if (e.target.closest && (e.target.closest('[data-nogesture]') || e.target.closest('[data-swipe]') !== el)) return;
      const t = e.changedTouches[0];
      const dx = t.clientX - x0, dy = t.clientY - y0;
      if (Math.abs(dx) < 56 || Math.abs(dx) < Math.abs(dy) * 1.4) return;
      if (el.dataset.swipe === 'cards') suppressNextClick();
      handleSwipe(el.dataset.swipe, dx < 0 ? 'left' : 'right');
    }, { passive: true });
  });
  document.querySelectorAll('[data-pages-rail]').forEach(rail => {
    const dots = rail.parentElement?.querySelectorAll('[data-pages-dots] > span');
    if (!dots?.length) return;
    const paint = () => {
      const max = rail.scrollWidth - rail.clientWidth;
      const p = max > 0 ? rail.scrollLeft / max : 0;
      const idx = Math.round(p * (dots.length - 1));
      dots.forEach((d, di) => {
        const on = di === idx;
        d.style.width = on ? '20px' : '6px';
        d.style.opacity = on ? '1' : '.25';
      });
    };
    rail.addEventListener('scroll', paint, { passive: true });
    paint();
  });
}

/* Bottom sheet: the single overlay pattern used everywhere. */
function sheet(html, resolve, bind) {
  const wrap = document.createElement('div');
  wrap.className = 'fixed inset-0 z-[60] flex items-end sm:items-center justify-center bg-ink/40 backdrop-blur-[2px] anim-fade p-0 sm:p-6';
  wrap.innerHTML = `<div class="anim-up w-full max-w-md max-h-[92dvh] overflow-y-auto overscroll-contain bg-paper dark:bg-night-900 rounded-t-[28px] sm:rounded-[28px] px-5 pt-2.5 pb-[calc(env(safe-area-inset-bottom)+20px)] shadow-lift border border-ink/10 dark:border-white/10" role="dialog" aria-modal="true">
    <div class="mx-auto mb-3 mt-1 h-1.5 w-11 rounded-full bg-ink/15 dark:bg-white/20"></div>${html}</div>`;
  document.body.append(wrap);
  const close = v => { wrap.remove(); resolve(v); };
  wrap.addEventListener('click', e => {
    if (e.target === wrap) return close(null);
    const c = e.target.closest('[data-close]');
    if (c) close(c.dataset.close || null);
  });
  wrap.addEventListener('keydown', e => { if (e.key === 'Escape') close(null); });
  bind?.(wrap, close);
  setTimeout(()=>wrap.querySelector('input,textarea')?.focus(), 60);
}

    const i = Math.min(learnCard, set.cards.length - 1);

    const c = set.cards[learnOrder[i]];
    return `<div>${backBtn}
      <div class="mt-3 mb-2.5 px-1 flex items-center gap-3"><span class="text-[12px] font-bold uppercase tracking-[0.12em] text-ink/50 dark:text-white/50">Card ${i + 1} of ${set.cards.length}</span><span class="h-px flex-1 bg-ink/10 dark:bg-white/10"></span><button data-act="learnShuffle" class="shrink-0 text-[12px] font-bold uppercase tracking-[0.12em] text-moss-900 dark:text-emerald-200 min-h-[36px] px-2 press">Shuffle</button></div>
      <button data-act="learnFlip" data-swipe="cards" class="${card} w-full press text-center overflow-hidden select-none" aria-live="polite">
        <span class="flip-scene block p-6">
          <span data-flip-inner class="flip-inner${learnFlipped ? ' is-flipped' : ''}">

              <span class="font-serif text-[20px] font-semibold leading-snug tracking-tight break-words text-balance">${esc(c.front)}</span>
              <span class="text-[12px] font-semibold text-ink/40 dark:text-white/40">Tap to flip</span></span>
            <span class="flip-face flip-back min-h-[190px] flex flex-col items-center justify-center gap-3">
              <span class="text-[11px] font-bold uppercase tracking-[0.14em] text-moss-900 dark:text-emerald-200">Answer</span>
              <span class="font-serif text-[17px] leading-snug break-words text-balance">${esc(c.back)}</span>
              <span class="text-[12px] font-semibold text-ink/40 dark:text-white/40">Tap to flip back</span></span>
          </span></span></button>
      <div class="grid grid-cols-2 gap-3 mt-3">
        <button data-act="learnCardNav" data-d="-1" class="${secondary}">← Prev</button>
        <button data-act="learnCardNav" data-d="1" class="${secondary}">Next →</button></div></div>`;
  }

  if (learnMode === 'quiz') {
    if (!set.quiz.length) return `<div>${backBtn}<div class="mt-3">${empty(I.pen, 'No quiz yet', '')}</div></div>`;
    const done = set.quiz.filter((_, qi) => learnAnswers[qi] !== undefined).length;
    const score = set.quiz.filter((q, qi) => learnAnswers[qi] === q.answer).length;
    const opts = set.quiz.map((q, qi) => {
      const picked = learnAnswers[qi];
      const btns = q.options.map((t, oi) => {
        let cls = 'bg-cream dark:bg-night-900 border-sand dark:border-white/10';
        if (picked !== undefined) {
          if (oi === q.answer) cls = 'bg-emerald-500/12 border-emerald-500/40 text-emerald-800 dark:text-emerald-200';
          else if (oi === picked) cls = 'bg-clay-500/12 border-clay-500/40 text-clay-600 dark:text-orange-300';
          else cls = 'bg-cream dark:bg-night-900 border-sand dark:border-white/10 opacity-50';
        }
        return `<button data-act="learnAnswer" data-q="${qi}" data-o="${oi}" class="w-full text-start min-h-[50px] px-4 py-3 rounded-[16px] border text-[15px] font-medium press break-words ${cls}">${esc(t)}</button>`;
      }).join('');
      return `<section class="${cardPad} !p-4"><p class="font-bold text-[15.5px] leading-snug break-words">${esc(q.question)}</p>
        <div class="mt-3 space-y-2">${btns}</div></section>`;
    }).join('');
    return `<div>
      <div class="flex items-center gap-2">
        <div class="flex-1 min-w-0">${backBtn}</div>
        ${done ? `<button data-act="learnRestart" class="${ghostBtn} shrink-0 bg-cream dark:bg-night-900 border border-sand dark:border-white/10 shadow-soft">Restart</button>` : ''}
      </div>
      <div class="${card} mt-3 px-4 py-3.5 flex items-center gap-3">
        <span class="font-serif font-semibold text-[22px] leading-none">${score}<span class="text-ink/40 dark:text-white/40 text-[16px]">/${set.quiz.length}</span></span>
        <span class="text-[13px] font-semibold text-ink/55 dark:text-white/55">${done === set.quiz.length ? (score === set.quiz.length ? 'Perfect — nicely done' : 'Finished — try again?') : `${done} of ${set.quiz.length} answered`}</span></div>
      <div class="mt-3 space-y-3">${opts}</div></div>`;
  }

  const toolRow = (m, icon, title, meta) => `<button data-act="learnOpen" data-m="${m}" class="${card} w-full p-4 flex items-center gap-3.5 press text-start min-w-0">
    <span class="w-11 h-11 rounded-2xl bg-moss-900/[.08] dark:bg-white/10 text-moss-900 dark:text-cream grid place-items-center shrink-0">${icon}</span>
    <span class="flex-1 min-w-0"><span class="block font-bold text-[16px]">${title}</span>
    <span class="block text-[13px] text-ink/55 dark:text-white/55 mt-0.5">${meta}</span></span>
    <span class="w-8 h-8 rounded-full bg-ink/[.05] dark:bg-white/10 grid place-items-center text-ink/40 shrink-0">${I.chevron}</span></button>`;
  return `<div class="space-y-2.5">
    ${toolRow('teach', I.book, 'Teach me', 'Walkthrough in plain language')}
    ${toolRow('cards', I.pen, 'Flashcards', set.cards.length ? `${set.cards.length} cards` : 'No cards')}
    ${toolRow('quiz', I.spark, 'Quiz me', set.quiz.length ? `${set.quiz.length} questions` : 'No questions')}
    <button data-act="learnGen" data-id="${l.id}" class="${ghostBtn} w-full text-ink/50 dark:text-white/50">Regenerate study guide</button></div>`;
}

async function viewSearch() {
  const q = new URLSearchParams(location.hash.split('?')[1] || '');
  const term = (q.get('q') || '').trim().toLowerCase();
  const sid = q.get('s') || '';
  const [subjects, nbs, lessons, pages] = await Promise.all([db.subjects.toArray(), db.notebooks.toArray(), db.lessons.toArray(), db.pages.toArray()]);
  const nbMap = Object.fromEntries(nbs.map(n => [n.id, n]));
  const subjMap = Object.fromEntries(subjects.map(s => [s.id, s]));
  const pagesBy = {};
  for (const p of pages) (pagesBy[p.lessonId] ??= []).push(p);
  const hits = lessons.filter(l => {
    const nb = nbMap[l.notebookId];
    if (sid && nb?.subjectId !== sid) return false;
    if (!term) return true;
    return [l.title, ...(pagesBy[l.id] || []).flatMap(p => [p.transcript, p.summary])].some(t => (t || '').toLowerCase().includes(term));
  }).sort((a, b) => b.date.localeCompare(a.date));

  const filt = (val, label, color) => `<button type="submit" name="s" value="${val}" class="shrink-0 min-h-[42px] pl-3 pr-4 rounded-full text-[14px] font-semibold press border flex items-center gap-2 ${sid === val ? 'bg-ink dark:bg-cream text-paper dark:text-ink border-ink dark:border-cream' : 'bg-cream dark:bg-night-900 border-sand dark:border-white/10 shadow-soft'}">${color?`<span class="w-2.5 h-2.5 rounded-full" style="background:${color}"></span>`:''}${esc(label)}</button>`;

  put(heroHeader({eyebrowText:'Find anything', title:'Search'})
    + `<form data-form="search" class="px-5 md:px-2 mt-4 space-y-3 max-w-2xl mx-auto">
      <label class="relative block"><span class="absolute start-4 top-1/2 -translate-y-1/2 text-ink/40 dark:text-white/40">${I.search}</span>
        <input name="q" type="search" value="${esc(q.get('q') || '')}" placeholder="Search lessons…" class="${inputCls} ps-11 !rounded-full !min-h-[54px]"></label>
      <div class="-mx-5 md:mx-0 px-5 md:px-0 flex gap-2 overflow-x-auto no-scrollbar pb-1">
        ${filt('', 'All')}${subjects.map(s => filt(s.id, s.name, s.color)).join('')}
      </div></form>`
    + `<div class="px-5 md:px-2 mt-4 max-w-2xl mx-auto">
      ${hits.length ? `<div class="space-y-2.5">${hits.map(l => {
        const s = subjMap[nbMap[l.notebookId]?.subjectId];
        return `<a href="#/lesson/${l.id}" class="${card} flex items-stretch overflow-hidden press text-start min-w-0">
          <span class="w-[6px] shrink-0" style="background:${s?.color || '#a1a1aa'}"></span>
          <span class="p-4 min-w-0 flex-1"><span class="block font-bold text-[15.5px] truncate">${esc(l.title)}</span>
          <span class="mt-1 flex items-center gap-1.5 text-[13px] text-ink/55 dark:text-white/55 min-w-0"><span class="w-1.5 h-1.5 rounded-full shrink-0" style="background:${s?.color||'#a1a1aa'}"></span><span class="truncate">${esc(s?.name || '')} · ${fmt(l.date)}</span></span></span>
          <span class="self-center pe-3 text-ink/30 shrink-0">${I.chevron}</span></a>`;
      }).join('')}</div>` : `<div class="mt-6">${empty(I.search, term ? 'No matches' : 'No lessons yet', '')}</div>`}</div>`);
}

const ROUTES = [
  [/^#\/?$/, viewHome],
  [/^#\/subject\/([\w-]+)$/, viewSubject],
  [/^#\/notebook\/([\w-]+)$/, viewNotebook],
  [/^#\/lesson\/([\w-]+)$/, viewLesson],
  [/^#\/capture$/, viewCapture],
  [/^#\/search$/, viewSearch],
  [/^#\/settings$/, viewSettings]
];

async function route() {
  revokeUrls();
  const path = (location.hash || '#/').split('?')[0];
  setActiveNav(path);
  for (const [re, fn] of ROUTES) {
    const m = path.match(re);
    if (m) return run(() => fn(...m.slice(1)));
  }
  go('#/');
}

async function run(fn) {
  try { await fn(); }
  catch (e) {
    if (['QuotaExceededError', 'DatabaseClosedError', 'OpenFailedError', 'UnknownError'].includes(e.name)) return recovery(e);
    toast(e.userMessage || 'Something went wrong. Please try again.');
  }
}

/* ============================================================
   6. ACTIONS, FORMS, CHANGES
   ============================================================ */
const cap = s => s[0].toUpperCase() + s.slice(1);

const A = {
  menu: async ({ kind, id }) => {
    const choice = await pick(kind === 'lesson' ? 'Lesson' : kind === 'notebook' ? 'Notebook' : 'Subject', [
      { v: 'rename', label: 'Rename' },
      { v: 'delete', label: 'Delete', danger: true }
    ]);
    if (choice === 'rename') return A[`rename${cap(kind)}`]({ id });
    if (choice === 'delete') return A[`delete${cap(kind)}`]({ id });
  },
  newSubject: async () => {
    const v = await formSheet({ title: 'New subject', ok: 'Add subject', fields: [{ name: 'name', label: 'Name', required: true, placeholder: 'e.g. Biology' }] });
    if (!v?.name?.trim()) return;
    const n = await db.subjects.count();
    await db.subjects.add({ id: uid(), name: v.name.trim(), color: COLORS[n % COLORS.length], icon: '', order: n, createdAt: now(), updatedAt: now() });
    toast('Subject added');
    route();
  },
  renameSubject: async ({ id }) => {
    const s = await db.subjects.get(id);
    const v = await formSheet({ title: 'Rename subject', fields: [{ name: 'name', label: 'Name', value: s.name, required: true }] });
    if (!v?.name?.trim()) return;
    await db.subjects.update(id, { name: v.name.trim(), updatedAt: now() }); route();
  },
  deleteSubject: async ({ id }) => {
    const s = await db.subjects.get(id);
    const nbIds = await db.notebooks.where('subjectId').equals(id).primaryKeys();
    const lessonIds = nbIds.length ? await db.lessons.where('notebookId').anyOf(nbIds).primaryKeys() : [];
    const ok = await formSheet({ title: `Delete ${s.name}?`, danger: true, ok: 'Delete',
      message: `Removes ${nbIds.length} notebooks and ${lessonIds.length} lessons with their photos. This can't be undone.` });
    if (!ok) return;
    await removeLessons(lessonIds);
    await db.notebooks.bulkDelete(nbIds);
    await db.subjects.delete(id);
    go('#/');
  },
  newNotebook: async ({ subject }) => {
    const v = await formSheet({ title: 'New notebook', ok: 'Create', fields: [
      { name: 'title', label: 'Title', value: 'Notebook', required: true },
      { name: 'term', label: 'Term or unit', placeholder: 'e.g. Fall 2026' }] });
    if (!v?.title?.trim()) return;
    await db.notebooks.add({ id: uid(), subjectId: subject, title: v.title.trim(), term: (v.term || '').trim(), createdAt: now(), updatedAt: now() });
    go(`#/subject/${subject}`);
  },
  renameNotebook: async ({ id }) => {
    const nb = await db.notebooks.get(id);
    const v = await formSheet({ title: 'Rename notebook', fields: [
      { name: 'title', label: 'Title', value: nb.title, required: true },
      { name: 'term', label: 'Term or unit', value: nb.term || '' }] });
    if (!v?.title?.trim()) return;
    await db.notebooks.update(id, { title: v.title.trim(), term: (v.term || '').trim(), updatedAt: now() }); route();
  },
  deleteNotebook: async ({ id }) => {
    const nb = await db.notebooks.get(id);
    const lessonIds = await db.lessons.where('notebookId').equals(id).primaryKeys();
    const ok = await formSheet({ title: `Delete ${nb.title}?`, danger: true, ok: 'Delete',
      message: `Removes ${lessonIds.length} lessons with their photos. This can't be undone.` });
    if (!ok) return;
    await removeLessons(lessonIds);
    await db.notebooks.delete(id);
    go(`#/subject/${nb.subjectId}`);
  },
  renameLesson: async ({ id }) => {
    const l = await db.lessons.get(id);
    const v = await formSheet({ title: 'Lesson title', fields: [{ name: 'title', label: 'Title', value: l.title, required: true }] });
    if (!v?.title?.trim()) return;
    await db.lessons.update(id, { title: v.title.trim(), updatedAt: now() }); route();
  },
  deleteLesson: async ({ id }) => {
    const l = await db.lessons.get(id);
    const ok = await formSheet({ title: `Delete ${l.title}?`, danger: true, ok: 'Delete', message: "Removes the photos and summary. This can't be undone." });
    if (!ok) return;
    await removeLessons([id]);
    go(`#/notebook/${l.notebookId}`);
  },
  retry: async ({ id }) => {
    const pageIds = await db.pages.where('lessonId').equals(id).primaryKeys();
    await db.pendingJobs.bulkPut(pageIds.map(pid => ({ id: pid, pageId: pid, attempts: 0, lastError: null, createdAt: now() })));
    await db.lessons.update(id, { status: 'processing', reason: null, updatedAt: now() });
    toast('Trying again…');
    route(); processPending();
  },
  readNow: async () => {
    if (!((await getSetting('geminiApiKey') || '').trim())) return toast('Add your Gemini key first');
    if (!navigator.onLine) return toast('You look offline — reconnect and try again');
    if (!(await db.pendingJobs.count())) return toast('Nothing waiting — all caught up');
    toast('Reading queued photos…');
    route(); processPending();
  },
  tab: ({ tab }) => { lessonTab = tab; buzz(8); keepScroll(); route(); },
  learnOpen: ({ m }) => { learnMode = m || 'menu'; learnCard = 0; learnFlipped = false; buzz(8); route(); },
  learnFlip: () => {
    learnFlipped = !learnFlipped;
    buzz(12);
    const inner = document.querySelector('[data-flip-inner]');
    if (inner) inner.classList.toggle('is-flipped', learnFlipped);
    else { keepScroll(); route(); }
  },
  learnCardNav: ({ d }) => {
    learnCard = (((learnCard + (+d || 0)) % learnLen) + learnLen) % learnLen;
    learnFlipped = false; buzz(10); keepScroll(); route();
  },
  learnShuffle: () => {
    for (let i = learnOrder.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [learnOrder[i], learnOrder[j]] = [learnOrder[j], learnOrder[i]];
    }
    learnCard = 0; learnFlipped = false; buzz(15); keepScroll(); route();
    toast('Shuffled');
  },
  learnAnswer: async ({ q, o }) => {
    q = +q; o = +o;
    if (learnAnswers[q] !== undefined || learnLock) return;
    learnLock = true;
    const set = await db.learnSets.where('lessonId').equals(lastLearnLesson).first();
    const correct = set && set.quiz[q] && o === set.quiz[q].answer;
    const btn = document.querySelector(`[data-act="learnAnswer"][data-q="${q}"][data-o="${o}"]`);
    if (btn) {
      btn.classList.remove('bg-cream', 'dark:bg-night-900', 'border-sand', 'dark:border-white/10');
      btn.classList.add('anim-pop', ...(correct
        ? ['bg-emerald-500/15', 'border-emerald-500/50']
        : ['bg-clay-500/15', 'border-clay-500/50']));
    }
    buzz(correct ? 25 : [70, 40, 70]);
    setTimeout(() => {
      learnAnswers[q] = o;
      learnLock = false;
      if (set) {
        const done = set.quiz.filter((_, qi) => learnAnswers[qi] !== undefined).length;
        const score = set.quiz.filter((qu, qi) => learnAnswers[qi] === qu.answer).length;
        if (done === set.quiz.length && score === set.quiz.length && set.quiz.length) {
          confetti(); buzz([20, 60, 20, 60, 90]);
          toast('Perfect score');
        }
      }
      keepScroll(); route();
    }, 340);
  },
  learnRestart: () => { learnAnswers = {}; keepScroll(); route(); },
  learnGen: async ({ id }) => {
    const l = await db.lessons.get(id); if (!l) return;
    const pages = await db.pages.where('lessonId').equals(id).sortBy('order');
    const blocks = await db.summaryBlocks.where('lessonId').equals(id).sortBy('order');
    if (!buildLearnContent(pages, blocks).trim()) return toast('Wait until photos are read first');
    learnLoading = true; learnLoadingFor = id; route();
    try {
      const set = await generateLearn(l, buildLearnContent(pages, blocks));
      const old = await db.learnSets.where('lessonId').equals(id).first();
      if (old) await db.learnSets.update(old.id, { ...set, updatedAt: now() });
      else await db.learnSets.add({ id: uid(), lessonId: id, ...set, createdAt: now(), updatedAt: now() });
      learnMode = 'menu'; learnCard = 0; learnFlipped = false; learnAnswers = {}; learnOrder = [];
      toast('Study guide ready');
    } catch (e) {
      toast(e.userMessage || (e.message === 'NO_KEY' ? 'Add your Gemini key in Settings first' : friendlyError(e.message)));
    } finally { learnLoading = false; learnLoadingFor = null; route(); }
  },
  locate: async ({ id }) => {
    const b = await db.summaryBlocks.get(id);
    activeBlock = id; lessonTab = 'pages'; scrollToPage = b.sourcePageId;
    go(`#/lesson/${b.lessonId}`);
  },
  editBlock: async ({ id }) => {
    const b = await db.summaryBlocks.get(id);
    const v = await formSheet({ title: 'Edit note', fields: [{ name: 'text', label: 'Text', value: b.text, required: true, multi: true }] });
    if (!v?.text?.trim()) return;
    await db.summaryBlocks.update(id, { text: v.text.trim() }); route();
  },
  correct: async ({ page, idx }) => {
    const p = await db.pages.get(page);
    const u = p?.uncertain?.[+idx]; if (!u) return;
    const v = await formSheet({ title: 'What does it say?', message: `Unclear: ${u.reason}`, ok: 'Save note',
      fields: [{ name: 'text', label: 'Correct text', value: u.text, required: true, multi: true }] });
    if (!v?.text?.trim()) return;
    const count = await db.summaryBlocks.where('lessonId').equals(p.lessonId).count();
    await db.transaction('rw', [db.pages, db.summaryBlocks], async () => {
      await db.summaryBlocks.add({ id: uid(), lessonId: p.lessonId, sourcePageId: p.id, type: 'point', text: v.text.trim(), sourceRegion: null, order: 1000 + count });
      await db.pages.update(p.id, { uncertain: p.uncertain.filter((_, i) => i !== +idx) });
    });
    toast('Saved to summary');
    route();
  },
  pickSubject: ({ id }) => { captureState.subjectId = id; captureState.nb = ''; keepScroll(); route(); },
  pickNotebook: ({ id }) => { captureState.nb = id; keepScroll(); route(); },
  reveal: () => { const i = document.querySelector('input[name=key]'); if (i) i.type = i.type === 'password' ? 'text' : 'password'; },
  theme: async ({ v }) => { await setSetting('theme', v); applyTheme(v); route(); },
  export: async () => {
    const [subjects, notebooks, lessons, pages, summaryBlocks, pendingJobs, learnSets] = await Promise.all([
      db.subjects.toArray(), db.notebooks.toArray(), db.lessons.toArray(), db.pages.toArray(), db.summaryBlocks.toArray(), db.pendingJobs.toArray(), db.learnSets.toArray()]);
    const pagesOut = [];
    for (const { imageBlob, thumbnailBlob, ...p } of pages) {
      pagesOut.push({ ...p, imageData: await blobToDataURL(imageBlob), thumbData: await blobToDataURL(thumbnailBlob) });
    }
    const settings = (await db.settings.toArray()).filter(s => s.key !== 'geminiApiKey');
    const data = { app: 'notebook', version: 2, exportedAt: new Date().toISOString(), subjects, notebooks, lessons, pages: pagesOut, summaryBlocks, pendingJobs, learnSets, settings };
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([JSON.stringify(data)], { type: 'application/json' }));
    a.download = `notebook-backup-${today()}.json`;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    await setSetting('lastBackupAt', now());
    toast('Backup downloaded');
    route();
  },
  reset: async () => {
    const ok = await formSheet({ title: 'Reset Notebook?', danger: true, ok: 'Reset everything',
      message: 'Deletes every subject, lesson, and photo in this browser. Export a backup first.' });
    if (!ok) return;
    await db.delete();
    location.reload();
  }
};

const FORMS = {
  key: async form => {
    const k = new FormData(form).get('key').trim();
    await setSetting('geminiApiKey', k);
    toast(k ? 'Key saved' : 'Key removed');
    processPending();
  },
  search: (form, submitter) => {
    const current = new URLSearchParams(location.hash.split('?')[1] || '');
    const q = new FormData(form).get('q') || '';
    const s = submitter?.name === 's' ? submitter.value : current.get('s') || '';
    go(`#/search?q=${encodeURIComponent(q)}&s=${encodeURIComponent(s)}`);
  },
  capture: async form => {
    const fd = new FormData(form);
    if (!captureState.url) return toast('Take or choose a photo first');
    const subjectId = fd.get('subject');
    let nbId = fd.get('notebook');
    const t = now();
    if (!nbId) {
      nbId = uid();
      await db.notebooks.add({ id: nbId, subjectId, title: 'General', term: '', createdAt: t, updatedAt: t });
    }
    const lessonId = uid(), pageId = uid();
    const [img, thumb] = await Promise.all([compress(captureState.file, 1600, 0.8), compress(captureState.file, 300, 0.7)]);
    await db.lessons.add({ id: lessonId, notebookId: nbId, date: fd.get('date') || today(),
      title: (fd.get('title') || '').trim() || 'Untitled lesson', status: 'processing', reason: null, createdAt: t, updatedAt: t });
    await db.pages.add({ id: pageId, lessonId, imageBlob: img, thumbnailBlob: thumb, transcript: '', summary: '', uncertain: [], order: 0, createdAt: t });
    await db.pendingJobs.put({ id: pageId, pageId, attempts: 0, lastError: null, createdAt: t });
    await setSetting('lastSubjectId', subjectId);
    URL.revokeObjectURL(captureState.url);
    captureState = {};
    toast('Saved. Reading the board…');
    buzz(30);
    go(`#/lesson/${lessonId}`);
    processPending();
  }
};

const CHANGES = {
  pickPhoto: el => {
    const f = el.files[0]; if (!f) return;
    if (captureState.url) URL.revokeObjectURL(captureState.url);
    captureState = { ...captureState, file: f, url: URL.createObjectURL(f) };
    route();
  },
  addPage: async el => {
    const f = el.files[0]; if (!f) return;
    const lessonId = location.hash.split('?')[0].split('/')[2];
    const n = await db.pages.where('lessonId').equals(lessonId).count();
    const [img, thumb] = await Promise.all([compress(f, 1600, 0.8), compress(f, 300, 0.7)]);
    const pid = uid(), t = now();
    await db.pages.add({ id: pid, lessonId, imageBlob: img, thumbnailBlob: thumb, transcript: '', summary: '', uncertain: [], order: n, createdAt: t });
    await db.pendingJobs.put({ id: pid, pageId: pid, attempts: 0, lastError: null, createdAt: t });
    await db.lessons.update(lessonId, { status: 'processing', reason: null, updatedAt: t });
    toast('Photo added. Reading it…');
    route(); processPending();
  },
  import: async el => {
    const f = el.files[0]; if (!f) return;
    let d;
    try { d = JSON.parse(await f.text()); }
    catch { throw { userMessage: 'That file could not be read.' }; }
    if (d.app !== 'notebook' || !Array.isArray(d.pages)) throw { userMessage: 'That is not a Notebook backup.' };
    const ok = await formSheet({ title: 'Replace everything?', danger: true, ok: 'Replace',
      message: 'Restoring replaces what is in this browser now. Your API key is kept.' });
    if (!ok) return;
    const key = await getSetting('geminiApiKey');
    const pages = [];
    for (const { imageData, thumbData, ...p } of d.pages) {
      pages.push({ ...p, imageBlob: await (await fetch(imageData)).blob(), thumbnailBlob: await (await fetch(thumbData)).blob() });
    }
    await db.transaction('rw', db.tables, async () => {
      await Promise.all(db.tables.map(t => t.clear()));
      await db.subjects.bulkPut(d.subjects || []);
      await db.notebooks.bulkPut(d.notebooks || []);
      await db.lessons.bulkPut(d.lessons || []);
      await db.pages.bulkPut(pages);
      await db.summaryBlocks.bulkPut(d.summaryBlocks || []);
      await db.learnSets.bulkPut(d.learnSets || []);
      await db.pendingJobs.bulkPut(d.pendingJobs || []);
      await db.settings.bulkPut((d.settings || []).filter(s => s.key !== 'geminiApiKey'));
    });
    if (key) await setSetting('geminiApiKey', key);
    toast('Backup restored');
    go('#/');
  }
};

document.addEventListener('click', e => {
  if (Date.now() < suppressClickUntil) { e.preventDefault(); suppressClickUntil = 0; return; }
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const fn = A[el.dataset.act];
  if (!fn) return;
  e.preventDefault();
  run(() => fn(el.dataset));
});
document.addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[role=button][data-act]')) {
    e.preventDefault(); e.target.click();
  }
});
document.addEventListener('submit', e => {
  const f = e.target;
  if (!f.dataset.form) return;
  e.preventDefault();
  run(() => FORMS[f.dataset.form](f, e.submitter));
});
document.addEventListener('change', e => {
  const k = e.target.dataset.change;
  if (k && CHANGES[k]) run(() => CHANGES[k](e.target));
});

/* ============================================================
   7. BOOT
   ============================================================ */
(async function boot() {
  try { await db.open(); }
  catch (e) { return recovery(e); }
  navigator.storage?.persist?.();
  applyTheme(await getSetting('theme', 'system'));
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', async () => {
    if ((await getSetting('theme', 'system')) === 'system') applyTheme('system');
  });
  window.addEventListener('hashchange', route);
  window.addEventListener('online', processPending);
  route();
  processPending();
})();
</script>
</body>
</html>
